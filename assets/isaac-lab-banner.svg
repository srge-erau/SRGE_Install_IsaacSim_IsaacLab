  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="82" y="131" fill="#75e284" font-size="18" font-weight="700" letter-spacing="4">ROBOTICS SIMULATION · LAB SETUP</text>
    <text x="78" y="211" fill="#f1f6f3" font-size="61" font-weight="750" letter-spacing="-2">Isaac Sim</text>
    <text x="78" y="278" fill="#f1f6f3" font-size="61" font-weight="750" letter-spacing="-2">+ Isaac Lab</text>
